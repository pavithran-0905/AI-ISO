[project]
name = "observability-platform-service"
version = "0.1.0"
description = "AI-IOS Enterprise Observability Platform Service — metrics, logs, traces, events, profiles, topology, correlation, SLO/SLI, anomaly detection, root cause analysis, capacity planning, and cost analytics"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "shared-core",
]

# No scientific-computing stack, and that is a decision rather than an
# omission. Every analytical engine here -- anomaly detection, forecasting,
# correlation, burn rate -- is implemented in terms the standard library
# provides, because the spec's DO NOT IMPLEMENT list rules out commercial
# observability SaaS and vendor agents, and an operator who cannot follow
# why a service was flagged will stop trusting the flag. numpy would make
# the arithmetic terser and the reasoning no clearer.

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-httpx>=0.35.0",
]

[tool.uv.sources]
shared-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # The same confirmed environment artefact every prior AI-IOS service's
  # own conftest documents: on Windows' ProactorEventLoop an asyncpg
  # connection properly disposed at one test's teardown is sometimes only
  # garbage-collected during a later, unrelated test whose event loop is
  # already closed, so asyncpg's __del__ raises an unraisable
  # ResourceWarning pytest attributes to that later test. Not a
  # connection leak in this service's own code.
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "def __repr__",
]
