[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "AI-IOS Enterprise Document Intelligence Service — OCR, layout analysis, classification, entity/table/form extraction, summarization, translation, validation, human review, and document analytics"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  # Document parsing. One dependency per format the spec names, and
  # nothing more.
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "pyyaml>=6.0.2",
  # OCR. Pillow decodes the image and reports its geometry; pytesseract
  # is a thin wrapper over the Tesseract *binary*, which is a system
  # package rather than a wheel. Both are declared because the engine
  # code is real and exercised; whether OCR can actually run is a
  # deployment question the service answers at startup rather than
  # discovering on the first scanned page -- see app/ocr/engine.py.
  #
  # Cloud OCR is out of scope by the spec's own DO NOT IMPLEMENT list,
  # so there is no hosted fallback and none is pretended.
  "pillow>=11.0.0",
  "pytesseract>=0.3.13",
  "shared-core",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-httpx>=0.35.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shared-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # The same confirmed environment artefact every prior AI-IOS service's
  # own conftest documents: on Windows' ProactorEventLoop an asyncpg
  # connection properly disposed at one test's teardown is sometimes only
  # garbage-collected during a later, unrelated test whose event loop is
  # already closed, so asyncpg's __del__ raises an unraisable
  # ResourceWarning pytest attributes to that later test. Not a
  # connection leak in this service's own code.
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "def __repr__",
]
